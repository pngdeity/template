name: Test template
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install copier with the jinja2_time extension
        run: pipx install "copier>=9" && pipx inject copier jinja2-time pyyaml
      - name: Verify copier can load jinja2_time
        run: |
          copier copy --pretend --defaults --trust . /tmp/probe \
            --data repo_name=probe --data 'languages=[]' \
            --data ci_provider=none --data use_precommit=false
      - name: Render every config
        run: python3 scripts/test_template.py
