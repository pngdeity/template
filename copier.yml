_min_copier_version: "9.0.0"
_templates_suffix: .jinja
_subdirectory: template
_skip_if_exists:
  - README.md
  - AGENTS.md
  - CHANGELOG.md
  - SECURITY.md
  - CONTRIBUTING.md
  - CODEOWNERS # active only when use_codeowners: true
  - TASKS.md
  - package.json
  - .env
  - "**/.gitkeep"
_exclude:
  - "**/__pycache__"
  - .git
  - _partials
_tasks:
  - ["git", "init"]
  - command: |
      if git remote get-url origin >/dev/null 2>&1 && [ "$(git remote get-url origin)" = "{{ fork_upstream }}" ]; then
        git remote rename origin upstream
      else
        git remote add upstream "{{ fork_upstream }}" 2>/dev/null || true
      fi
    when: "{{ fork_upstream and _copier_operation == 'copy' }}"
  - command: ["git", "fetch", "upstream"]
    when: "{{ fork_upstream and _copier_operation == 'copy' }}"
  - command: ["git", "branch", "--set-upstream-to=upstream/{{ fork_upstream_branch }}", "main"]
    when: "{{ fork_upstream and _copier_operation == 'copy' }}"
  - command: "pre-commit install"
    when: "{{ use_precommit and _copier_operation == 'copy' }}"
  - command: "pre-commit install --hook-type commit-msg"
    when: "{{ use_commitizen and use_precommit and _copier_operation == 'copy' }}"
  - command: >-
      command -v apm >/dev/null 2>&1 && apm install || echo "  → apm not found — run: apm install"
    when: "{{ use_apm and _copier_operation == 'copy' }}"
# _external_data:
#   parent_tpl: .copier-answers.yml
_jinja_extensions:
  - jinja2_time.TimeExtension
_envops:
  undefined: jinja2.StrictUndefined
  trim_blocks: true
  lstrip_blocks: true
_message_after_copy: |
  {{ repo_name }} scaffolded successfully.

  Next steps:
    cd {{ _copier_conf.dst_path }}
    {% if use_precommit %}pre-commit install
    pre-commit install --hook-type commit-msg
    {% endif %}
    {% if include_shell_tooling %}shellcheck **/*.sh{% endif %}
    Start coding{% if languages %} in {{ languages | join(', ') }}{% endif %}.
  {% if use_apm %}apm install   # if apm not auto-detected during scaffold{% endif %}
  {% if is_node_library %}
  Publishing:
    Register a trusted publisher for {{ repo_name }} at
    https://www.npmjs.com/package/{{ repo_name }}/access, then tag a release
    (git tag v0.1.0 && git push --tags). No NPM_TOKEN is used.
    The first publish needs: npm publish --access public
  {% endif %}
  {% if has_node and node_runtime == 'bun' %}
  Bun runs the tests directly: `bun test` is the script in package.json, and no
  tsconfig.json is generated because bun transpiles TypeScript itself.
  {% endif %}
  {% if has_node and node_runtime == 'deno' %}
  No package.json was created: node_runtime is deno, so deno.json is the only
  Node-side config and `deno test` is the test runner.
  {% endif %}
  {% if has_node_build %}
  Build before testing: run the build script once (see package.json scripts).
  {% endif %}
  {% if has_node and node_lint != 'deno' %}
  Formatter note: node_lint is {{ node_lint }}, so deno is not the formatter of
  record here. TOOLING.md's LSP matrix row for this language does not apply.
  {% endif %}
  {% if ci_provider == 'github' %}
  Repository settings:
    Enable "Require signed commits" in branch protection rulesets.
    Enable Dependabot alerts and security updates.
  {% endif %}
  {% if fork_upstream %}  Remote `upstream` set to {{ fork_upstream }}.
    Create your fork on your forge, then: git remote add origin <your-fork-url>
  {% endif %}
_message_after_update: |
  {{ repo_name }} updated.
  Review changes with: git diff
  {% if use_precommit %}
  Re-run: pre-commit install
  {% endif %}
  {% if has_node %}
  package.json is in _skip_if_exists and was not modified.
  {% if is_node_library %}
  Merge the publish fields (exports, files, publishConfig, repository) from this
  template by hand, or the package stays private.
  {% endif %}
  {% endif %}
repo_name:
  type: str
  help: Repository name (kebab-case)
  default: my-project
  validator: "{% if not (repo_name | regex_search('^[a-z][a-z0-9-]*$')) %}Must be kebab-case (lowercase, hyphens, no spaces){% endif %}"
repo_description:
  type: str
  help: One-line description
  default: ""
author_name:
  type: str
  help: Author or organization name
  default: "Nathan Somers"
author_email:
  type: str
  help: Author or organization email
  default: ""
  validator: "{% if author_email and not (author_email | regex_search('.+@.+\\..+')) %}Must be a valid email or left empty{% endif %}"
github_username:
  type: str
  help: GitHub username or org slug (URL-safe, used in repo URLs)
  default: "pngdeity"
license_type:
  type: str
  help: License
  choices:
    - MIT
    - Apache-2.0
    - GPL-3.0
    - proprietary
  default: MIT
languages:
  type: yaml
  help: Programming languages used
  multiselect: true
  choices:
    - python
    - javascript
    - typescript
    - go
    - rust
    - dotnet
    - tofu
  default: []
# ── computed helpers (available to subsequent when: conditions) ──
has_node:
  type: bool
  default: "{{ 'javascript' in languages or 'typescript' in languages }}"
  when: false
has_python:
  type: bool
  default: "{{ 'python' in languages }}"
  when: false
has_typescript:
  type: bool
  default: "{{ 'typescript' in languages }}"
  when: false
has_go:
  type: bool
  default: "{{ 'go' in languages }}"
  when: false
has_rust:
  type: bool
  default: "{{ 'rust' in languages }}"
  when: false
has_dotnet:
  type: bool
  default: "{{ 'dotnet' in languages }}"
  when: false
has_tofu:
  type: bool
  default: "{{ 'tofu' in languages }}"
  when: false
# ── language-specific interactive questions ──
tofu_context:
  type: str
  help: OpenTofu usage context
  choices:
    - org
    - app
  default: org
  when: "{{ has_tofu }}"
go_scaffolding:
  type: str
  help: Go directory layout
  choices:
    - application
    - tooling
  default: application
  when: "{{ has_go }}"
go_module_path:
  type: str
  help: Go module path
  default: "{{ 'github.com/' + (github_username | default('user') | lower) + '/' + repo_name }}"
  when: "{{ has_go }}"
dotnet_namespace:
  type: str
  help: .NET root namespace
  default: "{{ repo_name | replace('-', ' ') | title | replace(' ', '') }}"
  when: "{{ has_dotnet }}"
python_scaffolding:
  type: str
  help: Python directory layout
  choices:
    - application
    - tooling
  default: application
  when: "{{ has_python }}"
node_package_manager:
  type: str
  help: Node package manager
  choices:
    - npm
    - pnpm
    - yarn
    - bun
  default: npm
  when: "{{ has_node }}"
node_runtime:
  type: str
  help: Node runtime and test runner
  choices:
    - node
    - bun
    - deno
  default: node
  when: "{{ has_node }}"
node_purpose:
  type: str
  help: Node package purpose
  choices:
    - application
    - - library
      - value: library
        validator: "{{ 'a Deno project has no package.json, so it cannot publish to npm' if node_runtime == 'deno' else '' }}"
    - - plugin
      - value: plugin
        validator: "{{ 'an OpenCode plugin is loaded from a package.json entrypoint, which Deno does not produce — select none or a package manager runtime' if node_runtime == 'deno' else '' }}"
  default: application
  when: "{{ has_node }}"
node_build:
  type: str
  help: Node build and type-check tool
  choices:
    - none
    - - tsc
      - value: tsc
        validator: "{{ 'Deno has no tsconfig.json to drive — select none' if node_runtime == 'deno' else '' }}"
    - - tsup
      - value: tsup
        validator: "{{ 'Deno has no tsconfig.json to drive — select none' if node_runtime == 'deno' else '' }}"
  default: none
  when: "{{ has_node }}"
node_lint:
  type: str
  help: Node formatter and linter
  choices:
    - - deno
      - value: deno
        validator: "{{ 'dependencies are installed with npm-compatible tooling, so deno cannot format or lint this tree — select biome' if node_package_manager in ('bun', 'pnpm') else '' }}"
    - biome
  default: deno
  when: "{{ has_node }}"
node_subpath_exports:
  type: yaml
  help: >-
    Extra subpath entrypoints, one per line as name: path (e.g. core: src/core.ts). Leave empty for none. "server" and "tui" are already emitted for a plugin, and "." is always present unless the purpose is plugin with no build.
  default: []
  when: "{{ is_node_publishable | default(false) }}"
ci_provider:
  type: str
  help: CI/CD provider
  choices: |
    {% if languages | length > 0 %}
    - github
    {% else %}
    - none
    {% endif %}
  default: "{% if languages | length > 0 %}github{% else %}none{% endif %}"
use_precommit:
  type: bool
  help: Enable pre-commit hooks?
  default: true
use_commitizen:
  type: bool
  help: Enforce Conventional Commits via commitizen?
  default: "{{ languages | length > 0 }}"
include_tasks_lint:
  type: bool
  help: Include CI check that lints TASKS.md?
  default: true
  ask: "{{ ci_provider == 'github' }}"
use_prereg:
  type: bool
  help: Require a pre-registration block on every non-trivial task?
  default: false
  ask: "{{ ci_provider == 'github' and include_tasks_lint }}"
include_annotation_gate:
  type: bool
  help: Include CI check that blocks FIXME/HACK/BUG annotations?
  default: false
  ask: "{{ ci_provider == 'github' }}"
include_shell_tooling:
  type: bool
  help: Include shell tooling (.shellcheckrc)?
  default: false
include_contributing:
  type: bool
  help: Include CONTRIBUTING.md?
  default: false
include_security:
  type: bool
  help: Include SECURITY.md?
  default: false
use_codeowners:
  type: bool
  help: Use CODEOWNERS for automated PR review assignment?
  default: false
use_apm:
  type: bool
  help: Scaffold apm.yml for agent dependency management?
  default: false
use_devcontainer:
  type: bool
  help: Scaffold .devcontainer with language-specific features?
  default: true
gitleaks_allowlist:
  type: yaml
  default: []
  when: false
gitleaks_allowlist_description:
  type: str
  default: "project-specific exclusions"
  when: false
apm_packages:
  type: yaml
  default: []
  when: false
# ── Node tool assumptions ──
# Four independent decisions. Do not collapse them: a project may install with
# one tool, test with another, and never build at all.
is_node_library:
  type: bool
  default: "{{ has_node and node_purpose == 'library' and node_runtime != 'deno' }}"
  when: false
# Whether the package is a published, loadable artefact rather than a private
# app. A plugin is a library with a different entrypoint contract, so every
# branch that asks "is this published?" should ask this, not is_node_library.
is_node_publishable:
  type: bool
  default: "{{ has_node and node_purpose in ('library', 'plugin') and node_runtime != 'deno' }}"
  when: false
is_node_plugin:
  type: bool
  default: "{{ has_node and node_purpose == 'plugin' and node_runtime != 'deno' }}"
  when: false
has_node_build:
  type: bool
  default: "{{ has_node and node_build != 'none' and node_runtime != 'deno' }}"
  when: false
uses_deno:
  type: bool
  default: "{{ has_node and (node_runtime == 'deno' or node_lint == 'deno') }}"
  when: false
# Whether the project needs bun on the machine and in CI: either the runtime
# is bun, or the package manager is. The package manager alone installs and
# invokes, so a bun-managed project still needs the binary.
uses_bun:
  type: bool
  default: "{{ has_node and (node_runtime == 'bun' or node_package_manager == 'bun') }}"
  when: false
# The package manager runs the script; the runtime defines what the script
# contains. Both feed this, so no template file hardcodes a runner.
node_test_cmd:
  type: str
  default: >-
    {%- if node_runtime == 'deno' -%}deno test {%- elif node_runtime == 'bun' -%}bun test {%- elif node_package_manager == 'pnpm' -%}pnpm test {%- elif node_package_manager == 'yarn' -%}yarn test {%- elif node_package_manager == 'bun' -%}bun run test {%- else -%}npm test {%- endif -%}
  when: false
node_install_cmd:
  type: str
  default: >-
    {%- if node_package_manager == 'pnpm' -%}pnpm install --frozen-lockfile {%- elif node_package_manager == 'yarn' -%}yarn install --immutable {%- elif node_package_manager == 'bun' -%}bun install --frozen-lockfile {%- else -%}npm ci {%- endif -%}
  when: false
node_lint_cmd:
  type: str
  default: >-
    {%- if node_lint == 'deno' -%}deno fmt --check && deno lint {%- else -%}npx biome check . {%- endif -%}
  when: false
# The runner recorded inside package.json's own "test" script. This is the
# runtime alone: the package manager invokes it via node_test_cmd, so naming a
# manager here would make the script call itself.
node_test_runner:
  type: str
  default: >-
    {%- if node_runtime == 'deno' -%}deno test {%- elif node_runtime == 'bun' -%}bun test {%- else -%}node --test {%- endif -%}
  when: false
node_build_cmd:
  type: str
  default: >-
    {%- if node_build == 'tsc' -%}tsc {%- elif node_build == 'tsup' -%}tsup src/index.ts --format esm --dts {%- endif -%}
  when: false
# ── fork workflow ──
fork_upstream:
  type: str
  help: Upstream repo URL for fork workflow (sets git `upstream` remote)
  placeholder: https://github.com/original-owner/repo.git
  default: ""
fork_upstream_branch:
  type: str
  help: Upstream default branch name
  default: main
  when: "{{ fork_upstream }}"
codeowners_maintainers:
  type: str
  help: CODEOWNERS default team (e.g. @myorg/maintainers)
  default: ""
  when: "{{ use_codeowners }}"
codeowners_frontend:
  type: str
  help: CODEOWNERS frontend team
  default: ""
  when: "{{ use_codeowners and has_node }}"
codeowners_devops:
  type: str
  help: CODEOWNERS DevOps/infra team
  default: ""
  when: "{{ use_codeowners and (has_tofu or ci_provider == 'github') }}"
# ── remaining computed values ──
project_slug:
  type: str
  default: "{{ repo_name | lower | replace('-', '_') | replace(' ', '_') }}"
  when: false
copyright_year:
  type: str
  default: "{% now 'utc', '%Y' %}"
  when: false
go_directive:
  type: str
  default: "1.26"
  when: false
go_prior1:
  type: str
  default: "{{ '1.' ~ (go_directive.split('.')[1] | int - 1) | string }}"
  when: false
go_prior2:
  type: str
  default: "{{ '1.' ~ (go_directive.split('.')[1] | int - 2) | string }}"
  when: false
python_version:
  type: str
  default: "3.12"
  when: false
rust_version:
  type: str
  default: "1.96"
  when: false
dotnet_sdk_version:
  type: str
  default: "10.0.200"
  when: false
dotnet_tfm:
  type: str
  default: "net10.0"
  when: false
node_version:
  type: str
  default: "24"
  when: false
tofu_version:
  type: str
  default: "1.12.0"
  when: false
tflint_version:
  type: str
  default: "0.9.1"
  when: false
